name: Conferir fontes e publicar

# Disparado quando a tarefa semanal do Claude envia a coleta (data/inbox/current/READY.json).
on:
  push:
    branches: [main]
    paths: ["data/inbox/current/READY.json"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Testes determinísticos (bloqueiam a publicação se falharem)
        run: npm run typecheck && npm test
      - name: Conferir cada fonte abrindo a página, aplicar portões e montar a edição
        run: npx tsx src/cli/index.ts INGERIR
      - name: Guardar histórico, auditoria e edição publicada
        if: always()
        run: |
          git config user.name "clinup-engine[bot]"
          git config user.email "clinup-engine@users.noreply.github.com"
          git add -A data public
          git diff --cached --quiet || git commit -m "Edição $(date -u +%Y-%m-%d): fontes conferidas e publicação"
          git push
      - uses: actions/configure-pages@v5
        if: always()
      - uses: actions/upload-pages-artifact@v4
        if: always()
        with:
          path: public
      - id: deploy
        if: always()
        uses: actions/deploy-pages@v4
