name: Diagnóstico de acesso a fontes

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: curl
        run: |
          for u in https://www.gov.br/ans/pt-br https://www.gov.br/trabalho-e-emprego/pt-br https://www.congressonacional.leg.br/ https://portal.cfm.org.br/ https://www.in.gov.br/; do
            echo "== $u"; curl -sS -o /dev/null -w "%{http_code} %{remote_ip} %{time_total}s\n" --max-time 25 -A "Mozilla/5.0" "$u" || true
          done
      - name: Internet Archive
        run: |
          U="https://www.gov.br/ans/pt-br/assuntos/noticias"
          echo "== available"; curl -sS --max-time 30 "https://archive.org/wayback/available?url=$U" ; echo
          echo "== save"; curl -sS -o /dev/null -D - --max-time 90 -A "Mozilla/5.0" "https://web.archive.org/save/$U" | grep -iE "^(HTTP|location|content-location)" || true
          echo "== latest snapshot"; curl -sS -L -o /tmp/s.html -w "%{http_code} %{size_download}\n" --max-time 60 "https://web.archive.org/web/2026id_/$U"; grep -o "<title>[^<]*" /tmp/s.html | head -2
      - name: node fetch
        run: |
          node -e '
          for (const u of ["https://www.gov.br/ans/pt-br","https://www.congressonacional.leg.br/"]) {
            fetch(u,{headers:{"user-agent":"Mozilla/5.0"},signal:AbortSignal.timeout(25000)})
              .then(r=>console.log(u,r.status))
              .catch(e=>console.log(u,"ERRO",e.message,e.cause?.code,e.cause?.message));
          }'
